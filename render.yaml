services:
  - type: web
    name: nature-unisex-salon
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python init_db.py && gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nature-salon-db
          property: connectionString
      - key: SALON_NAME
        value: "Nature Unisex Salon"
      - key: SALON_PHONE
        value: "+91 74837 37517"
      - key: SALON_WHATSAPP
        value: "917483737517"
      - key: SALON_ADDRESS
        value: "Kashi Vishwanatha, 12, Anjaneya Temple Street, Vannarpet, Yerappa Garden, Austin Town, Neelasandra, Bengaluru, Karnataka 560047, India"

databases:
  - name: nature-salon-db
    plan: free
    region: oregon
