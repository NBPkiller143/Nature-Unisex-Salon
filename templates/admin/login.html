<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Nature Unisex Salon</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  
  <style>
    body {
      background: linear-gradient(135deg, #091d15 0%, #163e2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.5rem;
      border: 1px solid rgba(197, 160, 89, 0.3);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: #edf4f0; color: var(--admin-primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem auto; border: 2px solid var(--admin-gold);">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <h2 style="font-family: var(--font-heading); font-size: 2rem; color: var(--admin-primary); margin-bottom: 0.2rem;">Nature Unisex Salon</h2>
      <p style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--admin-gold); font-weight: 700;">Administrator Portal</p>
    </div>

    <!-- Flash error messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 0.75rem 1rem; margin-bottom: 1.5rem; border-radius: var(--radius-sm); font-size: 0.85rem; {% if category == 'error' %}background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;{% elif category == 'success' %}background: #dcfce7; color: #166534; border: 1px solid #86efac;{% else %}background: #fef3c7; color: #92400e; border: 1px solid #fcd34d;{% endif %}">
            <i class="fa-solid fa-circle-info" style="margin-right: 0.4rem;"></i> {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="admin-form-group">
        <label for="username" class="admin-form-label">Username or Email</label>
        <div style="position: relative;">
          <input type="text" class="admin-form-control" id="username" name="username" required placeholder="admin" autofocus style="padding-left: 2.5rem;">
          <i class="fa-solid fa-user" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
        </div>
      </div>

      <div class="admin-form-group">
        <label for="password" class="admin-form-label">Password</label>
        <div style="position: relative;">
          <input type="password" class="admin-form-control" id="password" name="password" required placeholder="••••••••" style="padding-left: 2.5rem;">
          <i class="fa-solid fa-lock" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.8rem; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
          <input type="checkbox" name="remember" value="1"> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
      </button>

      <div style="text-align: center; margin-top: 1.8rem; border-top: 1px solid var(--border-color); padding-top: 1.2rem;">
        <a href="{{ url_for('index') }}" style="color: var(--admin-primary); font-size: 0.85rem; font-weight: 600;">
          &larr; Return to Public Website
        </a>
      </div>
    </form>

  </div>

</body>
</html>
